# ============================================================
# HTTPS 叠加配置：在基础 compose 之上加一个 Caddy 反向代理
#
# 用法（不要直接用 docker compose，走 deploy.sh）：
#   ./deploy.sh https        # 构建并以 HTTPS 模式启动
#   ./deploy.sh https-down   # 停止
#
# 手动等价命令：
#   HOST_BIND=127.0.0.1 docker compose \
#     -f docker-compose.yml -f docker-compose.https.yml up -d --build
# ============================================================
services:
  caddy:
    image: caddy:2-alpine
    container_name: ansible-ui-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      # HTTP/3（QUIC），客户端不支持会自动回落到 TCP
      - "443:443/udp"

    environment:
      # 域名或 IP，来自 .env；缺了 Caddy 会启动失败并给出明确报错
      SITE_ADDRESS: ${SITE_ADDRESS:?请先在 deploy/.env 中设置 SITE_ADDRESS}
      # 后端容器内的监听端口，改了 PORT 也不用手改 Caddyfile
      UPSTREAM_PORT: ${PORT:-5000}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与账户信息持久化，重建容器不用重新签发（Let's Encrypt 有频率限制）
      - caddy-data:/data
      - caddy-config:/config

    depends_on:
      - ansible-ui

volumes:
  caddy-data:
  caddy-config:
