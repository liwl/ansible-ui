services:
  ansible-ui:
    build:
      # 构建上下文就是 deploy 目录，里面只有 context/（组装好的源码+静态资源，几 MB），
      # 不会把 web/node_modules 之类的开发文件传给 Docker daemon。
      context: .
      dockerfile: Dockerfile
      # 构建期的包源，可在 .env 里覆盖。国内网络务必改镜像源，
      # 否则 pip 装 ansible/cryptography 基本会超时。
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: ansible-ui:latest
    container_name: ansible-ui
    restart: unless-stopped

    # .env 与 compose 文件同目录，变量替换和环境变量都从这里读
    env_file:
      - .env
    environment:
      PORT: ${PORT:-5000}
      ANSIBLE_HOST_KEY_CHECKING: ${ANSIBLE_HOST_KEY_CHECKING:-False}

    ports:
      # HOST_BIND 控制监听地址：
      #   HTTP 模式   0.0.0.0（默认，直接对外）
      #   HTTPS 模式  由 deploy.sh 置为 127.0.0.1，只允许 Caddy 走内网访问，
      #               避免绕过 HTTPS 直接打 5000 端口
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-5000}:${PORT:-5000}"

    volumes:
      # 数据库、日志、上传文件持久化，容器重建不丢数据
      - app-db:/app/db
      - app-logs:/app/logs
      - app-data:/app/data
      - app-uploads:/tmp/ansible_uploads
      # 如需使用 SSH 密钥认证，取消下面这行注释，并把密钥放到 deploy/ssh/ 下
      # - ./ssh:/root/.ssh:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:${PORT:-5000}/\" >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-db:
  app-logs:
  app-data:
  app-uploads:
